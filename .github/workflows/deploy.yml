name: Deploy to Hostpoint

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          yarn build

      - name: Build dashboard into frontend build output
        run: |
          cd dashboard
          npm install --legacy-peer-deps
          npm run build
          mkdir -p ../frontend/build/dashboard-website
          cp -r dist/* ../frontend/build/dashboard-website/
          cp .htpasswd-dashboard ../frontend/build/dashboard-website/.htpasswd-dashboard

      - name: Protect dashboard with Basic Auth
        run: |
          # HOSTPOINT_PATH is the absolute docroot path on the server (same target rsync uses)
          cat > frontend/build/dashboard-website/.htaccess <<EOF
          AuthType Basic
          AuthName "PLANMOVE Dashboard"
          AuthUserFile ${{ secrets.HOSTPOINT_PATH }}/dashboard-website/.htpasswd-dashboard
          Require valid-user
          EOF
          sed -i 's/^[[:space:]]*//' frontend/build/dashboard-website/.htaccess

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTPOINT_SSH_KEY }}

      - name: Upload to Hostpoint
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HOSTPOINT_PORT }} -o StrictHostKeyChecking=no -m hmac-sha2-512" \
            frontend/build/ \
            ${{ secrets.HOSTPOINT_USER }}@${{ secrets.HOSTPOINT_HOST }}:${{ secrets.HOSTPOINT_PATH }}
